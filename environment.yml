name: TaskFlow
channels:
  - defaults
  - conda-forge  # Utilisé pour certains paquets comme authlib
dependencies:
  - python=3.12  # Version de Python
  - flask  # Framework web pour créer l'application
  - bcrypt  # Pour hacher les mots de passe
  - mysql-connector-python  # Pour se connecter à la base de données MySQL
  - sphinx  # Génération de la documentation
  - pytest  # Pour écrire et exécuter les tests unitaires
  - pip  # Pour installer les dépendances pip si nécessaire
  - setuptools  # Pour les scripts Python
  - wheel  # Utilisé pour le packaging Python
  - openssl  # Pour la sécurité, nécessaire pour Authlib et Flask

  # Si d'autres packages spécifiques doivent être installés via pip
  - pip:
    - google-auth  # Pour la gestion de l'authentification Google, si nécessaire
    - google-auth-oauthlib
    - google-auth-httplib2
    - requests  # Pour les appels HTTP (parfois requis pour OAuth2)
